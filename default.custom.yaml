# Rime default settings
# encoding: utf-8
#
# 用户自定义配置
# 此文件会覆盖 default.yaml 中的对应配置项

patch:
  # 方案列表 - 只保留全拼
  schema_list:
    - schema: rime_ice  # 雾凇拼音（全拼）

  # 方案选单快捷键 - 删除 Control+grave
  "switcher/hotkeys":
    - F4
    - Control+Shift+grave

  # 快捷键配置
  "key_binder/bindings/+":
    # 启用逗号句号翻页
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    # 启用 Control+h 作为退格键
    - { when: composing, accept: Control+h, send: BackSpace }

  # 禁用 Control+Shift+3/4 的中英标点和简繁切换
  "key_binder/bindings":
    __remove:
      - { when: always, toggle: ascii_punct, accept: Control+Shift+3 }
      - { when: always, toggle: ascii_punct, accept: Control+Shift+numbersign }
      - { when: always, toggle: traditionalization, accept: Control+Shift+4 }
      - { when: always, toggle: traditionalization, accept: Control+Shift+dollar }
